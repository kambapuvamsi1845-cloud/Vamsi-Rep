kind = "web"
previewPath = "/"
title = "AgriCycle AI"
description = "An agricultural sustainability platform connecting farm planning, water optimization, harvest timing, and fresh produce sales for farmers and consumers."
version = "1.0.0"
id = "artifacts/agricycle-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21579

[services.development]
run = "pnpm --filter @workspace/agricycle-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agricycle-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/agricycle-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21579"
BASE_PATH = "/"
